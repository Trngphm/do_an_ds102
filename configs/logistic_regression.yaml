dataset:
  train:
    path: datasets/clean_data/train_data.csv
  dev:
    path: datasets/clean_data/dev_data.csv
  test:
    path: datasets/clean_data/test_data.csv
    
model:
  name: LogisticRegression
  architecture: Logistic_Regression
  params:
    C: [0.001, 0.01, 0.1, 1, 10, 100]
    penalty: ["l1", "l2"]
    solver: ["newton-cg", "lbfgs", "saga"]
  tuning_method: "grid"

checkpoint_path: checkpoints/awa2_logistic
